<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>iNet Browser 7</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #008080;
      font-family: Tahoma, Verdana, sans-serif;
    }

    /* ── DESKTOP ── */
    #desktop {
      position: fixed;
      inset: 0 0 28px 0;
      overflow: hidden;
    }

    /* ── BROWSER WINDOWS ── */
    .gb-window {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: #d4d0c8;
      border: 2px outset #e0dcd4;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.45);
      overflow: hidden;
    }

    /* Main window fills entire desktop */
    #gbMainWin {
      inset: 0;
    }

    /* Popup window — positioned offset, sits on top */
    #gbPopupWin {
      top: 18px; left: 36px; right: 36px; bottom: 14px;
      z-index: 200;
      display: none;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.5);
    }

    /* ── TITLE BAR ── */
    .gb-titlebar {
      background: linear-gradient(to right, #0a2080 0%, #1a50c8 50%, #0a2080 100%);
      padding: 3px 4px 3px 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      user-select: none;
      cursor: default;
    }
    .gb-titlebar.inactive {
      background: linear-gradient(to right, #6a7080 0%, #9098a8 50%, #6a7080 100%);
    }
    .gb-titlebar-icon { font-size: 12px; flex-shrink: 0; }
    .gb-title {
      flex: 1;
      font-size: 11px;
      color: #fff;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gb-winctrls { display: flex; gap: 2px; flex-shrink: 0; }
    .gb-wctrl {
      width: 16px; height: 14px;
      background: linear-gradient(to bottom, #dcd8d0, #b8b4ac);
      border: 1px outset #e0dcd4;
      font-size: 9px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #000; font-weight: bold; padding: 0; line-height: 1;
    }
    .gb-wctrl:hover { background: linear-gradient(to bottom, #ece8e0, #c8c4bc); }
    .gb-wctrl:active { border-style: inset; }
    .gb-wctrl.gb-close { background: linear-gradient(to bottom, #e08080, #b84040); color: #fff; }
    .gb-wctrl.gb-close:hover { background: linear-gradient(to bottom, #f09090, #cc5050); }

    /* ── TAB STRIP ── */
    .gb-tabstrip {
      background: #b8c0cc;
      border-bottom: 1px solid #888;
      display: flex;
      align-items: flex-end;
      padding: 4px 4px 0;
      gap: 2px;
      flex-shrink: 0;
      min-height: 26px;
    }
    .gb-tab {
      background: #c8d0d8;
      border: 1px solid #888;
      border-bottom: none;
      padding: 3px 8px;
      font-size: 10px;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      max-width: 200px;
      white-space: nowrap; overflow: hidden;
      border-radius: 3px 3px 0 0;
    }
    .gb-tab:hover { background: #d8e0e8; }
    .gb-tab.gb-tab-active {
      background: #d4d0c8;
      border-bottom-color: #d4d0c8;
      z-index: 1; font-weight: bold;
    }
    .gb-tab-title { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .gb-tab-x {
      font-size: 10px; color: #666; cursor: pointer; flex-shrink: 0;
      width: 13px; height: 13px; display: flex; align-items: center;
      justify-content: center; border-radius: 2px; line-height: 1;
    }
    .gb-tab-x:hover { background: #c04040; color: #fff; }
    .gb-tab-new {
      background: transparent; border: 1px solid transparent;
      padding: 3px 9px; font-family: monospace; font-size: 13px;
      cursor: pointer; color: #445566;
      border-radius: 3px 3px 0 0; flex-shrink: 0;
    }
    .gb-tab-new:hover { background: #c8d4dc; border-color: #888; }

    /* ── TOOLBAR ── */
    .gb-toolbar {
      background: #d4d0c8;
      border-bottom: 2px groove #b8b4ac;
      padding: 3px 5px;
      display: flex; align-items: center; gap: 3px;
      flex-shrink: 0;
    }
    .gb-sep { width: 1px; height: 18px; background: #aaa; margin: 0 2px; flex-shrink: 0; }
    .gb-navbtn {
      width: 22px; height: 20px;
      background: linear-gradient(to bottom, #e4e0d8, #c8c4bc);
      border: 1px outset #d4d0c8;
      cursor: pointer; font-size: 9px;
      display: flex; align-items: center; justify-content: center;
      color: #000; flex-shrink: 0; padding: 0;
    }
    .gb-navbtn:hover { background: linear-gradient(to bottom, #eceae0, #d4d0c8); }
    .gb-navbtn:active { border-style: inset; }
    .gb-navbtn:disabled { opacity: 0.4; cursor: default; }
    .gb-addr-wrap { flex: 1; display: flex; align-items: center; gap: 3px; }
    .gb-addr-label { font-size: 10px; color: #333; flex-shrink: 0; margin-right: 1px; }
    .gb-addr-input {
      flex: 1; height: 19px;
      background: #fff; border: 1px inset #888;
      font-size: 11px; padding: 0 5px; outline: none; color: #000080;
    }
    .gb-addr-input:focus { border-color: #000080; }
    .gb-go-btn {
      height: 20px;
      background: linear-gradient(to bottom, #e4e0d8, #c8c4bc);
      border: 1px outset #d4d0c8; cursor: pointer;
      font-size: 10px; padding: 0 10px; flex-shrink: 0; color: #000;
    }
    .gb-go-btn:hover { background: linear-gradient(to bottom, #eceae0, #d4d0c8); }
    .gb-go-btn:active { border-style: inset; }

    /* ── CONTENT AREA ── */
    .gb-content {
      flex: 1; overflow: hidden;
      background: #fff;
      border: 2px inset #aaa;
      margin: 2px 3px;
    }
    .gb-content iframe {
      width: 100%; height: 100%;
      border: none; display: block;
    }

    /* ── STATUS BAR ── */
    .gb-statusbar {
      background: #d4d0c8; border-top: 1px solid #b8b4ac;
      padding: 2px 6px;
      display: flex; justify-content: space-between;
      font-size: 9px; color: #333;
      flex-shrink: 0;
    }
    .gb-status-zone { border-left: 1px solid #b8b4ac; padding-left: 6px; }

    /* ── TASKBAR ── */
    #taskbar {
      position: fixed;
      bottom: 0; left: 0; right: 0; height: 28px;
      background: linear-gradient(to bottom, #c0c0c8 0%, #d4d0c8 60%);
      border-top: 2px outset #e0dcd4;
      display: flex; align-items: center; gap: 3px;
      padding: 0 3px;
      z-index: 9999;
      user-select: none;
    }
    #tbStart {
      height: 22px; padding: 0 8px 0 5px;
      background: linear-gradient(to bottom, #c0c8c0, #a0a8a0);
      border: 2px outset #d4d0c8;
      font-size: 11px; font-weight: bold; color: #000;
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }
    #tbStart:active { border-style: inset; }
    .tb-sep { width: 1px; height: 18px; background: #999; margin: 0 2px; }
    .tb-win-btn {
      height: 22px; padding: 0 8px;
      background: linear-gradient(to bottom, #b0b8c0, #c8d0d8);
      border: 2px outset #d4d0c8;
      font-size: 10px; color: #000;
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      white-space: nowrap; overflow: hidden; max-width: 160px;
    }
    .tb-win-btn.active {
      background: linear-gradient(to bottom, #9098a0, #b0b8c0);
      border-style: inset;
    }
    .tb-win-btn:active { border-style: inset; }
    #tbClock {
      margin-left: auto;
      height: 22px; padding: 0 8px;
      background: linear-gradient(to bottom, #c0c8c0, #a8b0a8);
      border: 1px inset #b0b8b0;
      font-size: 10px; color: #000;
      display: flex; align-items: center;
      flex-shrink: 0; min-width: 55px; justify-content: center;
    }
  </style>
</head>
<body>

  <div id="desktop">

    <!-- ══ MAIN BROWSER WINDOW ══ -->
    <div id="gbMainWin" class="gb-window">

      <div class="gb-titlebar" id="gbMainTitlebar">
        <span class="gb-titlebar-icon">🌐</span>
        <span class="gb-title" id="gbMainTitle">openfeed.icu - iNet Browser 7</span>
        <div class="gb-winctrls">
          <button class="gb-wctrl" title="Minimize" onclick="tbMinimizeMain()">&#8722;</button>
          <button class="gb-wctrl" title="Maximize">&#9633;</button>
          <!-- No close — this is the main shell -->
        </div>
      </div>

      <div class="gb-tabstrip" id="gbMainTabstrip"></div>

      <div class="gb-toolbar">
        <button class="gb-navbtn" id="gbMainBack" onclick="gbMainGoBack()" title="Back">&#9664;</button>
        <button class="gb-navbtn" id="gbMainFwd"  onclick="gbMainGoFwd()"  title="Forward">&#9654;</button>
        <button class="gb-navbtn" onclick="gbMainRefresh()" title="Refresh">&#8635;</button>
        <button class="gb-navbtn" onclick="gbMainGoHome()" title="Home">&#8962;</button>
        <div class="gb-sep"></div>
        <div class="gb-addr-wrap">
          <span class="gb-addr-label">Address</span>
          <input type="text" id="gbMainAddr" class="gb-addr-input"
                 value="http://openfeed.icu"
                 autocomplete="off" spellcheck="false"
                 onkeydown="if(event.key==='Enter')gbMainGo()">
          <button class="gb-go-btn" onclick="gbMainGo()">Go</button>
        </div>
      </div>

      <div class="gb-content">
        <iframe id="gbMainFrame"
                data-main-tab="0"
                src="index.html"
                sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-popups"
                allowfullscreen></iframe>
      </div>

      <div class="gb-statusbar">
        <span id="gbMainStatus">Done</span>
        <span class="gb-status-zone">Internet</span>
      </div>

    </div><!-- /gbMainWin -->


    <!-- ══ POPUP BROWSER WINDOW (news article, etc.) ══ -->
    <div id="gbPopupWin" class="gb-window">

      <div class="gb-titlebar" id="gbPopupTitlebar"
           onmousedown="gbPopupDragStart(event)">
        <span class="gb-titlebar-icon">🌐</span>
        <span class="gb-title" id="gbPopupTitle">New Tab - iNet Browser 7</span>
        <div class="gb-winctrls">
          <button class="gb-wctrl" title="Minimize" onclick="tbMinimizePopup()">&#8722;</button>
          <button class="gb-wctrl" title="Maximize">&#9633;</button>
          <button class="gb-wctrl gb-close" title="Close" onclick="closePopupBrowser()">&#215;</button>
        </div>
      </div>

      <div class="gb-tabstrip" id="gbPopupTabstrip"></div>

      <div class="gb-toolbar">
        <button class="gb-navbtn" id="gbPopupBack" onclick="gbPopupGoBack()" title="Back">&#9664;</button>
        <button class="gb-navbtn" id="gbPopupFwd"  onclick="gbPopupGoFwd()"  title="Forward">&#9654;</button>
        <button class="gb-navbtn" onclick="gbPopupRefresh()" title="Refresh">&#8635;</button>
        <div class="gb-sep"></div>
        <div class="gb-addr-wrap">
          <span class="gb-addr-label">Address</span>
          <input type="text" id="gbPopupAddr" class="gb-addr-input"
                 placeholder="http://"
                 autocomplete="off" spellcheck="false"
                 onkeydown="if(event.key==='Enter')gbPopupGo()">
          <button class="gb-go-btn" onclick="gbPopupGo()">Go</button>
        </div>
      </div>

      <div class="gb-content">
        <iframe id="gbPopupFrame"
                src="about:blank"
                sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-popups"></iframe>
      </div>

      <div class="gb-statusbar">
        <span id="gbPopupStatus">Done</span>
        <span class="gb-status-zone">Internet</span>
      </div>

    </div><!-- /gbPopupWin -->

  </div><!-- /desktop -->


  <!-- ══ TASKBAR ══ -->
  <div id="taskbar">
    <button id="tbStart">&#127758; Start</button>
    <div class="tb-sep"></div>
    <button class="tb-win-btn active" id="tbBtnMain"
            onclick="tbFocusMain()">🌐 openfeed.icu - iNet Browser 7</button>
    <button class="tb-win-btn" id="tbBtnPopup" style="display:none"
            onclick="tbFocusPopup()">🌐 <span id="tbBtnPopupLabel">New Tab</span></button>
    <div id="tbClock">00:00</div>
  </div>


  <script>
    // ── PAGE MAPPINGS ──────────────────────────────────────────────────────────
    var GB_PAGES = {
      'openfeed.icu':    'index.html',
      'openfeed':        'index.html',
      'index.html':      'index.html',
      'westfieldherald': 'news.html',
      'news.html':       'news.html',
      'tools.html':      'tools.html',
      'forum.html':      'forum.html',
      'map.html':        'map.html',
      'radio.html':      'radio.html',
      'about.html':      'about.html'
    };

    var MAIN_HOME_URL   = 'http://openfeed.icu';
    var MAIN_HOME_FILE  = 'index.html';
    var GB_SFX = {
      click: 'audio/foley/MouseClick_SFXB.4114.wav',
      key: [
        'audio/foley/KeyboardTypeKeystroke_BW._1.wav',
        'audio/foley/ComputerKeyboard_SFXB.4079.wav',
        'audio/foley/ComputerKeyboard_SFXB.4080.wav',
        'audio/foley/AppleKeyboard_S08TE.10.wav'
      ],
      keyConfirm: 'audio/foley/KeyboardTypeKeystroke_BW.49.wav',
      message: 'audio/foley/ESM_Recieve_Message_1_Notification_Synth_Electronic_Particle_Cute_Cartoon.wav',
      glitch: 'audio/foley/GLTCH_SFX_Ildcend.wav',
      emf: 'audio/foley/SUT_EMF_FX_09.wav',
      boom: 'audio/foley/Kit_6_FB_Sub_Boom.wav',
      beep: 'audio/foley/MO_LW_fx_beeb_beep.wav'
    };
    var _gbSfxPool = {};

    function gbPlaySfx(name, volume, pitch) {
      var src = GB_SFX[name];
      if (Array.isArray(src)) src = src[Math.floor(Math.random() * src.length)];
      if (!src) return;
      try {
        var pool = _gbSfxPool[name] || (_gbSfxPool[name] = []);
        var a = null;
        for (var i = 0; i < pool.length; i++) {
          if (pool[i].paused || pool[i].ended) { a = pool[i]; break; }
        }
        if (!a) {
          a = new Audio(src);
          a.preload = 'auto';
          pool.push(a);
        }
        a.pause();
        a.currentTime = 0;
        a.volume = Math.max(0, Math.min(1, volume == null ? 0.18 : volume));
        if ('playbackRate' in a) a.playbackRate = pitch || (0.96 + Math.random() * 0.08);
        var p = a.play();
        if (p && p.catch) p.catch(function(){});
      } catch (e) {}
    }

    function gbIsTypingKey(e) {
      if (!e || e.ctrlKey || e.metaKey || e.altKey) return false;
      if (e.repeat) return false;
      if (!e.key) return false;
      if (e.key.length === 1) return true;
      return e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Enter' || e.key === 'Tab' || e.key === ' ';
    }

    function gbPlayTypingSfx(e) {
      if (!gbIsTypingKey(e)) return;
      var target = e.target;
      if (!target) return;
      var tag = (target.tagName || '').toLowerCase();
      var editable = tag === 'input' || tag === 'textarea' || target.isContentEditable;
      if (!editable && target.closest) editable = !!target.closest('[contenteditable="true"]');
      if (!editable) return;
      var isConfirmKey = e.key === 'Enter' || e.key === ' ';
      var volume = e.key === 'Backspace' || e.key === 'Delete' ? 0.16 : 0.1 + Math.random() * 0.05;
      var pitch = e.key === 'Enter' ? 0.82 : 0.88 + Math.random() * 0.3;
      gbPlaySfx(isConfirmKey ? 'keyConfirm' : 'key', volume, pitch);
    }

    document.addEventListener('keydown', gbPlayTypingSfx, true);

    function gbInstallFrameTypingSfx(frame) {
      try {
        if (!frame || !frame.contentWindow || frame.contentWindow.__gbTypingSfxInstalled) return;
        if (typeof frame.contentWindow.ofPlayTypingSfx === 'function') return;
        frame.contentWindow.__gbTypingSfxInstalled = true;
        frame.contentDocument.addEventListener('keydown', function(e) {
          gbPlayTypingSfx(e);
        }, true);
      } catch (e) {}
    }

    function resolveUrl(url) {
      if (!url || url === 'about:blank') return null;
      var norm = url.toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '');
      for (var key in GB_PAGES) {
        if (norm.indexOf(key) >= 0) return GB_PAGES[key];
      }
      return null;
    }

    function displayUrl(raw) {
      if (!raw || raw === 'about:blank') return '';
      if (raw.indexOf('://') >= 0) return raw;
      // Map local filenames to fake domains
      var map = {
        'index.html': 'http://openfeed.icu',
        'news.html':  'http://westfieldherald.net/local/cctv-sighting',
        'tools.html': 'http://openfeed.icu/tools',
        'forum.html': 'http://signalwatch.net/signal_theory',
        'map.html':   'http://openfeed.icu/map',
        'radio.html': 'http://openfeed.icu/radio',
        'about.html': 'http://openfeed.icu/about'
      };
      return map[raw] || 'http://' + raw;
    }

    // ── TASKBAR CLOCK ─────────────────────────────────────────────────────────
    function updateClock() {
      var now = new Date();
      var h = now.getHours().toString().padStart(2, '0');
      var m = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('tbClock').textContent = h + ':' + m;
    }
    updateClock();
    setInterval(updateClock, 10000);

    // ── MAIN WINDOW ───────────────────────────────────────────────────────────
    var gbMainTabs    = [{ url: MAIN_HOME_FILE, title: 'openfeed.icu', frameId: 'gbMainFrame', closeNotifyType: null }];
    var gbMainActive  = 0;
    var gbMainMinimized = false;
    var gbMainOfflineLocked = false;

    function gbMainFrameForTab(i) {
      var tab = gbMainTabs[i];
      if (!tab) return null;
      return document.getElementById(tab.frameId || 'gbMainFrame');
    }

    function gbMainEnsureFrame(i) {
      var tab = gbMainTabs[i];
      if (!tab) return null;
      var frame = gbMainFrameForTab(i);
      if (frame) return frame;
      var content = document.querySelector('#gbMainWin .gb-content');
      if (!content) return null;
      frame = document.createElement('iframe');
      frame.id = tab.frameId;
      frame.setAttribute('data-main-tab', String(i));
      frame.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-forms allow-modals allow-popups');
      frame.setAttribute('allowfullscreen', '');
      frame.style.display = 'none';
      content.appendChild(frame);
      return frame;
    }

    function gbMainShowActiveFrame() {
      document.querySelectorAll('#gbMainWin .gb-content iframe').forEach(function(frame) {
        frame.style.display = frame.id === gbMainTabs[gbMainActive].frameId ? '' : 'none';
      });
    }

    function gbMainRenderTabs() {
      var strip = document.getElementById('gbMainTabstrip');
      if (!strip) return;
      strip.innerHTML = '';
      gbMainTabs.forEach(function(tab, i) {
        var t = document.createElement('div');
        t.className = 'gb-tab' + (i === gbMainActive ? ' gb-tab-active' : '');
        var lbl = document.createElement('span');
        lbl.className = 'gb-tab-title';
        lbl.textContent = tab.title || 'New Tab';
        t.appendChild(lbl);
        if (i > 0) {
          var x = document.createElement('button');
          x.className = 'gb-tab-x';
          x.textContent = 'x';
          x.title = 'Close tab';
          x.onclick = function(e) { e.stopPropagation(); gbMainCloseTab(i); };
          t.appendChild(x);
        }
        t.onclick = function() { gbMainSwitchTab(i); };
        strip.appendChild(t);
      });
      // No + button on main — one tab is enough for the openfeed site
    }

    function gbMainSwitchTab(i) {
      if (!gbMainTabs[i]) return;
      gbPlaySfx('click', 0.08);
      gbMainActive = i;
      gbMainRenderTabs();
      var frame = gbMainEnsureFrame(i);
      if (frame && !frame.getAttribute('src') && gbMainTabs[i].url) {
        gbMainLoadFile(gbMainTabs[i].url);
      }
      gbMainShowActiveFrame();
      var addr = document.getElementById('gbMainAddr');
      if (addr) addr.value = displayUrl(gbMainTabs[i].url);
      var title = gbMainTabs[i].title || 'New Tab';
      document.getElementById('gbMainTitle').textContent = title + ' - iNet Browser 7';
    }

    function gbMainCloseTab(i) {
      var tab = gbMainTabs[i];
      if (!tab || i === 0) return;
      gbPlaySfx('click', 0.1, 0.82);
      gbMainNotifyPrimaryTab(tab.closeNotifyType, tab.url, 'before-close');
      var frame = gbMainFrameForTab(i);
      if (frame && frame.parentNode) frame.parentNode.removeChild(frame);
      gbMainTabs.splice(i, 1);
      gbMainActive = Math.max(0, Math.min(gbMainActive, gbMainTabs.length - 1));
      gbMainRenderTabs();
      gbMainSwitchTab(gbMainActive);
      gbMainNotifyPrimaryTab(tab.closeNotifyType, tab.url, 'after-close');
      setTimeout(function () { gbMainNotifyPrimaryTab(tab.closeNotifyType, tab.url, 'after-close-retry'); }, 150);
      setTimeout(function () { gbMainNotifyPrimaryTab(tab.closeNotifyType, tab.url, 'after-close-retry-2'); }, 600);
    }

    function gbMainNotifyPrimaryTab(type, url, reason) {
      if (!type) return;
      document.querySelectorAll('#gbMainWin .gb-content iframe').forEach(function (mainFrame) {
        try {
          if (mainFrame && mainFrame.contentWindow) {
            mainFrame.contentWindow.postMessage({ type: type, url: url, reason: reason || '' }, '*');
            if (type === 'openfeed:articleTabClosed' && typeof mainFrame.contentWindow.anonMessengerHeraldClosed === 'function') {
              mainFrame.contentWindow.anonMessengerHeraldClosed();
            }
          }
        } catch (e) {}
      });
    }

    function openMainBrowserTab(url, title, closeNotifyType) {
      var file = resolveUrl(url) || url || 'about:blank';
      for (var i = 0; i < gbMainTabs.length; i++) {
        if (gbMainTabs[i].url === file && gbMainTabs[i].closeNotifyType === closeNotifyType) {
          gbMainSwitchTab(i);
          return;
        }
      }
      gbPlaySfx('message', 0.12, 0.85);
      var id = 'gbMainFrame_' + Date.now() + '_' + gbMainTabs.length;
      gbMainTabs.push({ url: file, title: title || 'New Tab', frameId: id, closeNotifyType: closeNotifyType || null });
      gbMainActive = gbMainTabs.length - 1;
      gbMainRenderTabs();
      gbMainLoadFile(file);
    }

    function isMainBrowserTabOpen(closeNotifyType, url) {
      var file = resolveUrl(url) || url || null;

      var addr  = document.getElementById('gbMainAddr');

      frame.onload = function() {
        gbInstallFrameTypingSfx(frame);
        if (status) status.textContent = 'Done';
        if (addr) addr.value = displayUrl(file);
        try {
          var t = frame.contentDocument && frame.contentDocument.title;

            gbMainRenderTabs();

            var btnLabel = document.getElementById('tbBtnMain');
            if (btnLabel) btnLabel.textContent = '🌐 ' + t;
          }

        // Inject link interceptor into the main frame so nav clicks update address bar
        try {
          var iDoc = frame.contentDocument;
          if (iDoc) {
            iDoc.addEventListener('click', function(e) {
              var a = e.target.closest ? e.target.closest('a') : (e.target.tagName === 'A' ? e.target : null);
              if (!a) return;
              // After a short delay, update address bar to reflect new URL
              setTimeout(function() {
                try {
                  if (frame.contentDocument) {
                    var newFile = frame.src.split('/').pop() || 'index.html';
                    if (addr) addr.value = displayUrl(newFile);

              }, 300);
            }, true);
          }

    function gbPopupAddTab(url, title) {
      gbPopupTabs.push({ url: url || 'about:blank', title: title || 'New Tab' });

      gbPopupRenderTabs();
      gbPopupLoadUrl(url);

    function gbPopupRenderTabs() {
      var strip = document.getElementById('gbPopupTabstrip');
      if (!strip) return;
      strip.innerHTML = '';
      gbPopupTabs.forEach(function(tab, i) {
        var t = document.createElement('div');
        t.className = 'gb-tab' + (i === gbPopupActive ? ' gb-tab-active' : '');
        var lbl = document.createElement('span');
        lbl.className = 'gb-tab-title';
        lbl.textContent = tab.title || 'New Tab';
        t.appendChild(lbl);
        if (gbPopupTabs.length > 1) {
          var x = document.createElement('span');
          x.className = 'gb-tab-x';
          x.textContent = '×';
          x.onclick = function(e) { e.stopPropagation(); gbPopupCloseTab(i); };
          t.appendChild(x);
        }
        t.onclick = function() { gbPopupSwitchTab(i); };
        strip.appendChild(t);
      });
      var add = document.createElement('div');
      add.className = 'gb-tab-new';
      add.textContent = '+';
      add.title = 'New Tab';
      add.onclick = function() { gbPopupAddTab('about:blank', 'New Tab'); };
      strip.appendChild(add);
    }

    function gbPopupSwitchTab(i) {
      gbPopupActive = i;
      gbPopupRenderTabs();
      gbPopupLoadUrl(gbPopupTabs[i].url);
    }

    function gbPopupCloseTab(i) {
      gbPopupTabs.splice(i, 1);
      if (gbPopupTabs.length === 0) { closePopupBrowser(); return; }
      gbPopupActive = Math.min(gbPopupActive, gbPopupTabs.length - 1);
      gbPopupRenderTabs();
      gbPopupLoadUrl(gbPopupTabs[gbPopupActive].url);
    }

    function gbPopupLoadUrl(url) {
      var frame  = document.getElementById('gbPopupFrame');
      var addr   = document.getElementById('gbPopupAddr');
      var status = document.getElementById('gbPopupStatus');
      var title  = document.getElementById('gbPopupTitle');
      if (!frame) return;

      if (!url || url === 'about:blank') {
        frame.src = 'about:blank';
        if (addr) addr.value = '';
        if (status) status.textContent = 'Done';
        return;
      }

      var localFile = resolveUrl(url);
      var dispUrl = (url.indexOf('://') >= 0) ? url : 'http://' + url;
      if (addr) addr.value = dispUrl;

      if (localFile) {
        if (status) status.textContent = 'Loading...';
        frame.src = localFile;
        frame.onload = function() {
          gbInstallFrameTypingSfx(frame);
          if (status) status.textContent = 'Done';
          try {
            var t = frame.contentDocument && frame.contentDocument.title;
            if (t) {
              var short = t.length > 40 ? t.substring(0, 38) + '…' : t;
              if (gbPopupTabs[gbPopupActive]) gbPopupTabs[gbPopupActive].title = short;
              gbPopupRenderTabs();
              if (title) title.textContent = t + ' - iNet Browser 7';
              var btn = document.getElementById('tbBtnPopupLabel');
              if (btn) btn.textContent = short;
            }
          } catch(e) {}
          // Intercept clicks in the popup iframe — open links as new tabs
          try {
            var iDoc = frame.contentDocument;
            if (iDoc) {
              iDoc.addEventListener('click', function(ev) {
                var a = ev.target.closest ? ev.target.closest('a') : (ev.target.tagName === 'A' ? ev.target : null);
                if (!a) return;
                var href = a.getAttribute('href');
                if (!href || href === '#' || href.charAt(0) === '#') return;
                var resolved = href.replace(/^\.\//, '');
                // Only intercept known openfeed/known pages
                if (resolveUrl(resolved)) {
                  ev.preventDefault();
                  ev.stopPropagation();
                  for (var ti = 0; ti < gbPopupTabs.length; ti++) {
                    if (gbPopupTabs[ti].url === resolved) { gbPopupSwitchTab(ti); return; }
                  }
                  gbPopupAddTab(resolved, a.textContent.trim() || resolved);
                }
              }, true);
            }
          } catch(e) {}
        };
      } else {
        frame.srcdoc = gbErrorPage(url);
        if (status) status.textContent = 'Cannot display page';
        if (gbPopupTabs[gbPopupActive]) gbPopupTabs[gbPopupActive].title = 'Cannot display page';
        gbPopupRenderTabs();
        if (title) title.textContent = 'Cannot display page - iNet Browser 7';
      }
    }

    // ── POPUP WINDOW DRAG ─────────────────────────────────────────────────────
    var _drag = null;
    function gbPopupDragStart(e) {
      if (e.target.classList.contains('gb-wctrl')) return;
      var win = document.getElementById('gbPopupWin');
      if (!win) return;
      tbFocusPopup();
      // Convert current computed position to absolute values
      var rect = win.getBoundingClientRect();
      win.style.top    = rect.top + 'px';
      win.style.left   = rect.left + 'px';
      win.style.right  = 'auto';
      win.style.bottom = 'auto';
      win.style.width  = rect.width + 'px';
      win.style.height = rect.height + 'px';
      _drag = { startX: e.clientX, startY: e.clientY, startTop: rect.top, startLeft: rect.left };
      document.addEventListener('mousemove', gbPopupDragMove);
      document.addEventListener('mouseup', gbPopupDragEnd);
      e.preventDefault();
    }

    function gbPopupDragMove(e) {
      if (!_drag) return;
      var win = document.getElementById('gbPopupWin');
      if (!win) return;
      var dx = e.clientX - _drag.startX;
      var dy = e.clientY - _drag.startY;
      win.style.top  = Math.max(0, _drag.startTop  + dy) + 'px';
      win.style.left = Math.max(0, _drag.startLeft + dx) + 'px';
    }

    function gbPopupDragEnd() {
      _drag = null;
      document.removeEventListener('mousemove', gbPopupDragMove);
      document.removeEventListener('mouseup', gbPopupDragEnd);
    }

      var st = document.createElement('style');
      st.textContent = [
        '@keyframes gsh-sm{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-1px,3px)}80%{transform:translate(2px,-1px)}}',
        '@keyframes gsh-md{0%,100%{transform:translate(0,0) skewX(0deg)}15%{transform:translate(-5px,2px) skewX(-0.4deg)}35%{transform:translate(5px,-3px) skewX(0.5deg)}55%{transform:translate(-3px,5px) skewX(-0.2deg)}75%{transform:translate(4px,-2px) skewX(0.3deg)}}',
        '@keyframes gsh-lg{0%,100%{transform:translate(0,0) skewX(0deg)}10%{transform:translate(-8px,4px) skewX(-1deg)}30%{transform:translate(8px,-5px) skewX(1.2deg)}50%{transform:translate(-5px,8px) skewX(-0.8deg)}70%{transform:translate(7px,-4px) skewX(0.9deg)}90%{transform:translate(-4px,6px) skewX(-0.5deg)}}',
        '.g-shake-sm{animation:gsh-sm 0.12s steps(1) infinite}',
        '.g-shake-md{animation:gsh-md 0.07s steps(1) infinite}',
        '.g-shake-lg{animation:gsh-lg 0.04s steps(1) infinite}',
      ].join('');
      document.head.appendChild(st);
    })();

    function shellGoOffline() {
      gbPlaySfx('boom', 0.3, 0.7);
      gbPlaySfx('beep', 0.18, 0.7);
      // Stop any active glitch first
      stopShellGlitch();
      gbMainOfflineLocked = true;

      var mainBar   = document.getElementById('gbMainTitlebar');
      var mainTitle = document.getElementById('gbMainTitle');
      var mainAddr  = document.getElementById('gbMainAddr');
      var mainFrame = document.getElementById('gbMainFrame');
      var taskbar   = document.getElementById('taskbar');
      var desktop   = document.getElementById('desktop');
      var tbMain    = document.getElementById('tbBtnMain');

      // Gray out title bar
      if (mainBar)   { mainBar.style.background  = '#2a2a2a'; mainBar.style.transition = 'background 0.4s'; }
      if (mainTitle) { mainTitle.textContent = 'openfeed.icu - connection lost'; mainTitle.style.color = '#555'; }
      if (mainAddr)  { try { mainAddr.value = 'ERR_CONNECTION_REFUSED'; mainAddr.style.color = '#666'; } catch(e){} }
      if (taskbar)   { taskbar.style.background = '#111'; taskbar.style.transition = 'background 0.4s'; }
      if (tbMain)    { tbMain.style.color = '#444'; }
      document.querySelectorAll('#gbMainWin .gb-navbtn, #gbMainWin .gb-go-btn').forEach(function (btn) {
        btn.disabled = true;
      });
      if (mainAddr) {
        mainAddr.disabled = true;
        mainAddr.style.pointerEvents = 'none';
      }

      // Dim the main browser frame with a dark overlay inside the desktop
      var offDiv = document.createElement('div');
      offDiv.id  = '__shellOfflineOverlay';
      offDiv.style.cssText = [
        'position:absolute;inset:0;z-index:9999;',
        'background:rgba(0,0,0,0.82);',
        'display:flex;align-items:center;justify-content:center;',
        'font-family:monospace;',
        'opacity:1;',
        'pointer-events:none;'
      ].join('');
      offDiv.innerHTML = '<div style="font-size:10px;letter-spacing:3px;color:#2a2a2a;text-align:center;user-select:none;">' +
                         'NO SIGNAL<br><span style="font-size:9px;letter-spacing:1px;color:#1e1e1e">openfeed.icu unreachable</span></div>';

      // Attach to desktop so it sits over the iframe
      var desktop2 = document.getElementById('desktop');
      if (desktop2) desktop2.appendChild(offDiv);

      // Instant appear — no fade

      // Close popup window if open
      var popupWin = document.getElementById('gbPopupWin');
      if (popupWin && popupWin.style.display !== 'none') {
        setTimeout(function() { closePopupBrowser(); }, 300);
      }
      notifyUnitySiteOffline();
    }

    function notifyUnitySiteOffline() {
      try {
        if (window.Unity && typeof window.Unity.call === 'function') {
          window.Unity.call('openfeed:siteOffline');
          return;
        }
      } catch(e) {}
      try {
        window.location.href = 'unity:openfeed:siteOffline';
      } catch(e) {}
    }

    // ── INIT ──────────────────────────────────────────────────────────────────
    gbMainRenderTabs();
    // Expose openPopupBrowser globally so index.html can call window.parent.openPopupBrowser(...)
    window.openPopupBrowser  = openPopupBrowser;
    window.openMainBrowserTab = openMainBrowserTab;
    window.isMainBrowserTabOpen = isMainBrowserTabOpen;
    window.triggerOpenfeedSiteGlitch = triggerOpenfeedSiteGlitch;
    window.scheduleOpenfeedSiteGlitch = scheduleOpenfeedSiteGlitch;
    window.closePopupBrowser = closePopupBrowser;
    window.triggerShellGlitch = triggerShellGlitch;
    window.stopShellGlitch    = stopShellGlitch;
    window.shellGoOffline     = shellGoOffline;

    window.addEventListener('message', function(e) {
      var data = e && e.data;
      if (!data) return;
      if (data.type === 'openfeed:openPopupBrowser') {
        openPopupBrowser(data.url, data.title);
      }
      if (data.type === 'openfeed:openMainBrowserTab') {
        openMainBrowserTab(data.url, data.title, data.closeNotifyType);
      }
      if (data.type === 'openfeed:siteOffline') {
        notifyUnitySiteOffline();
      }
    });

  </script>
</body>
</html>
